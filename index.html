<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aluno Pontual — Tabela de Prêmios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo:#5F1F82; --roxo-escuro:#3E1256; --azul:#00A9E2; --azul-escuro:#0087B8;
    --cinza:#D8DADE; --texto:#2B1338; --branco:#FFFFFF; --bg:#F7F5FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',sans-serif; background:var(--bg); color:var(--texto);
    min-height:100vh; padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px));
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .wrap{ max-width:780px; margin:0 auto; }
  header{
    display:flex; align-items:center; gap:16px; background:#4C257E;
    margin:calc(-20px - env(safe-area-inset-top,0px)) -20px 22px -20px;
    padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  }
  header img.logo{ width:130px; height:auto; flex:none; display:block; }
  header .titles{ line-height:1.15; }
  header h1{ font-family:'Fredoka',sans-serif; font-weight:700; color:#fff; font-size:24px; margin:0; }
  header p{ margin:2px 0 0; font-size:13px; color:#D8C9E4; font-weight:600; }
  .subtitle{ font-family:'Fredoka',sans-serif; font-weight:600; color:var(--roxo-escuro); font-size:18px; margin:22px 0 10px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .tab{
    position:relative; display:flex; align-items:center; gap:6px;
    border:2px solid var(--roxo); background:var(--branco); color:var(--roxo);
    font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:8px 14px;
    border-radius:999px; cursor:pointer; transition:.15s;
  }
  .tab svg{ width:16px; height:16px; flex:none; }
  .tab.active{ background:var(--roxo); color:#fff; }
  .tab .rm{ margin-left:4px; opacity:.7; font-weight:800; }
  .tab .rm:hover{ opacity:1; }
  .addbtn{
    border:2px dashed var(--azul); background:transparent; color:var(--azul-escuro); font-weight:700;
    font-size:13px; padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .hero{
    border-radius:18px; padding:22px 24px; margin-bottom:18px; color:#fff;
    display:flex; align-items:center; gap:16px;
    box-shadow:0 10px 24px -12px rgba(95,31,130,.4);
  }
  .hero svg{ width:52px; height:52px; flex:none; }
  .hero h2{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:20px; margin:0; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
  .card{
    background:var(--branco); border-radius:16px; padding:14px 16px; box-shadow:0 6px 16px -8px rgba(95,31,130,.25);
    display:flex; flex-direction:column; gap:8px; position:relative;
  }
  .card .rm{ position:absolute; top:8px; right:10px; color:#b7a7c2; font-weight:800; cursor:pointer; font-size:15px; }
  .card .rm:hover{ color:var(--roxo); }
  .card .art{ height:42px; display:flex; align-items:center; }
  .card .art img{ height:36px; max-width:100%; object-fit:contain; }
  .card .art svg{ width:34px; height:34px; color:var(--roxo); }
  .card .name{ font-weight:700; font-size:14.5px; padding-right:14px; }
  .card .pts{
    align-self:flex-start; background:linear-gradient(160deg,var(--azul),var(--azul-escuro)); color:#fff;
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:19px; padding:5px 14px; border-radius:10px;
  }
  .card input.ptsedit{
    width:90px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:17px; color:var(--roxo-escuro);
    border:2px solid var(--cinza); border-radius:8px; padding:4px 8px;
  }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin:22px 0 8px; flex-wrap:wrap; gap:10px; }
  .edit-toggle, .save-btn{
    font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:8px 16px; border-radius:999px;
    border:none; cursor:pointer;
  }
  .edit-toggle{ background:var(--cinza); color:var(--roxo-escuro); }
  .edit-toggle.on{ background:var(--roxo); color:#fff; }
  .save-btn{ background:var(--azul); color:#fff; display:none; }
  .save-btn.show{ display:inline-block; }
  .addprize{ margin-top:16px; }
  .hint{ font-size:12px; color:#8a7a95; margin-top:22px; text-align:center; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--roxo-escuro); color:#fff;
    padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.show{ opacity:1; }

  .modal-backdrop{position:fixed;inset:0;background:rgba(43,19,56,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000;}
  .modal-backdrop.show{display:flex;}
  .modal{width:min(100%,420px);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(43,19,56,.28);}
  .modal h3{font-family:'Fredoka',sans-serif;color:var(--roxo-escuro);font-size:21px;margin:0 0 18px;}
  .modal label{display:block;font-size:12px;font-weight:800;color:var(--texto);margin:12px 0 6px;}
  .modal input{width:100%;border:2px solid var(--cinza);border-radius:10px;padding:11px 12px;font:600 14px 'Manrope',sans-serif;outline:none;}
  .modal input:focus{border-color:var(--azul);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .modal-actions button{border:0;border-radius:999px;padding:10px 16px;font:700 13px 'Manrope',sans-serif;cursor:pointer;}
  .modal-cancel{background:var(--cinza);color:var(--roxo-escuro);}
  .modal-confirm{background:var(--azul);color:#fff;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function courseArt(id){return COURSE_ART[id]||DEFAULT_COURSE_ART;} function prizeArt(id){return PRIZE_ART[id]||DEFAULT_PRIZE_ART;}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
async function loadRemote(){
  var [cr,pr,cp]=await Promise.all([
    db.from('cursos').select('id,nome,ordem,ativo').eq('ativo',true).order('ordem').order('nome'),
    db.from('premios').select('id,nome,ordem,ativo').eq('ativo',true).order('ordem').order('nome'),
    db.from('curso_premios').select('curso_id,premio_id,pontos')
  ]);
  if(cr.error)throw cr.error;if(pr.error)throw pr.error;if(cp.error)throw cp.error;
  DATA={courses:(cr.data||[]).map(x=>({id:x.id,name:x.nome})),prizes:(pr.data||[]).map(x=>({id:x.id,name:x.nome})),points:{}};
  DATA.courses.forEach(c=>DATA.points[c.id]={});(cp.data||[]).forEach(x=>{if(DATA.points[x.curso_id])DATA.points[x.curso_id][x.premio_id]=x.pontos;});
  state.active=DATA.courses[0]?.id||null;
}
function renderTabs(){var box=document.getElementById('tabs');box.innerHTML='';DATA.courses.forEach(c=>{var art=courseArt(c.id),t=el('button','tab'+(c.id===state.active?' active':''),ICONS[art.icon]);var label=document.createElement('span');label.textContent=c.name;t.appendChild(label);t.onclick=()=>{state.active=c.id;renderAll();};box.appendChild(t);});}
function renderHero(){var box=document.getElementById('hero'),c=DATA.courses.find(x=>x.id===state.active);if(!c){box.style.display='none';return;}var art=courseArt(c.id);box.style.display='flex';box.style.background=art.grad;box.innerHTML=ICONS[art.icon]+'<h2>'+escapeHtml(c.name)+'</h2>';}
function renderCards(){var box=document.getElementById('cards');box.innerHTML='';if(!state.active){box.innerHTML='<p style="color:#8a7a95;">Nenhum curso cadastrado ainda.</p>';return;}var pts=DATA.points[state.active]||{};DATA.prizes.slice().sort((a,b)=>(pts[a.id]??0)-(pts[b.id]??0)).forEach(p=>{var card=el('div','card'),art=prizeArt(p.id),artBox=el('div','art');artBox.innerHTML=art.type==='img'?('<img src="'+art.src+'" alt="">'):ICONS[art.key];card.appendChild(artBox);card.appendChild(el('div','name',escapeHtml(p.name)));card.appendChild(el('div','pts',(pts[p.id]??0)+' pts'));box.appendChild(card);});document.getElementById('addPrize').style.display='none';}
function renderAll(){renderTabs();renderHero();renderCards();}
async function initApp(){try{await loadRemote();renderAll();}catch(e){console.error(e);document.getElementById('cards').innerHTML='<p style="color:#b42318;text-align:center;">Não foi possível carregar os prêmios. Tente recarregar a página.</p>';}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);else initApp();

</script>
